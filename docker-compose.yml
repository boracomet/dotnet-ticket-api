services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ticket_api}
      POSTGRES_USER: ${POSTGRES_USER:-ticket}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ticket_secret_change_me}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ticket} -d ${POSTGRES_DB:-ticket_api}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    ports:
      - "${APP_PORT:-8080}:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Docker
      Database__Provider: Postgres
      ConnectionStrings__Default: Host=postgres;Port=5432;Database=${POSTGRES_DB:-ticket_api};Username=${POSTGRES_USER:-ticket};Password=${POSTGRES_PASSWORD:-ticket_secret_change_me}
      Jwt__Secret: ${JWT_SECRET:-change-me-to-a-long-random-secret-at-least-32-chars!!}
      Jwt__Issuer: TicketApi
      Jwt__Audience: TicketApi
      FileStorage__Root: /app/uploads
      Smtp__Host: ${SMTP_HOST:-}
      Smtp__Port: ${SMTP_PORT:-587}
      Smtp__Username: ${SMTP_USERNAME:-}
      Smtp__Password: ${SMTP_PASSWORD:-}
      Smtp__FromEmail: ${SMTP_FROM_EMAIL:-}
      Smtp__FromName: ${SMTP_FROM_NAME:-Ticket Board}
      Smtp__EnableSsl: ${SMTP_ENABLE_SSL:-true}
      Smtp__Enabled: ${SMTP_ENABLED:-false}
    volumes:
      - uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build: ./web
    ports:
      - "${WEB_PORT:-3000}:80"
    depends_on:
      - app

volumes:
  pgdata:
  uploads:
